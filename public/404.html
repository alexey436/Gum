<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3:16 GYM — Перенаправлення на головну</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0B0A09;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        padding: 32px 24px;
        max-width: 420px;
        border-radius: 24px;
        background: #171513;
        border: 1px solid rgba(255, 163, 3, 0.2);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
        color: #FFA303;
        letter-spacing: 1px;
      }
      p {
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: #FFA303;
        color: #000000;
        font-weight: 800;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: transform 0.15s ease;
      }
      a:hover {
        transform: scale(1.03);
      }
    </style>
    <script>
      // Automatically redirect to the repository root on GitHub Pages
      (function() {
        var segments = window.location.pathname.split('/').filter(Boolean);
        // If hosted on https://<username>.github.io/<repo>/, segments[0] is <repo>
        var target = window.location.origin;
        if (segments.length > 0) {
          target += '/' + segments[0] + '/';
        } else {
          target += '/';
        }
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>3:16 GYM</h1>
      <p>Перенаправлення на головну сторінку клубу...</p>
      <a href="./">Перейти на головну</a>
    </div>
  </body>
</html>
